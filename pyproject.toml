[project]
name = "melanoma-til-scrna-seq"
version = "0.1.0"
description = "Single-cell analysis of the melanoma tumor immune microenvironment before/after TIL adoptive cell therapy (GEO GSE221553)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "scvi-tools>=1.1",
    "scikit-misc",
    "leidenalg",
    "igraph",
    "scrublet",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "jupyterlab",
    "ipykernel",
    "pydeseq2>=0.5.4",
]

[tool.uv]
package = false
